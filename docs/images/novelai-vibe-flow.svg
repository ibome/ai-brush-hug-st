<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1030" viewBox="0 0 960 1030" role="img" aria-labelledby="title desc">
  <title id="title">灵画师氛围转移：上传图片和导入编码两条路线</title>
  <desc id="desc">在 NovelAI 模式的生图工坊选择高级生图、参考生图、画风参考 Vibe。普通图片用添加画风参考上传后点击编码参考图按钮；现成 .naiv4vibe 文件直接导入。确认当前模型可用后填写提示词并生成。流程示意，非界面截图。</desc>
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #20303c; }
      .title { font-size: 40px; font-weight: 700; }
      .subtitle { font-size: 25px; fill: #5b6872; }
      .route { font-size: 29px; font-weight: 700; }
      .step { font-size: 28px; font-weight: 600; }
      .detail { font-size: 24px; fill: #52626c; }
      .number { font-size: 23px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .ready { font-size: 31px; font-weight: 700; fill: #17664b; text-anchor: middle; }
      .center { text-anchor: middle; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8" fill="none" stroke="#7d8a92" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="960" height="1030" fill="#ffffff"/>
  <text x="48" y="65" class="title">氛围转移 · Vibe 画风参考</text>
  <text x="48" y="107" class="subtitle">先分清素材类型，再选对应入口</text>
  <rect x="48" y="138" width="864" height="86" rx="8" fill="#f1f4f6"/>
  <text x="72" y="174" class="detail">NovelAI 模式 → 生图工坊 → 高级生图</text>
  <text x="72" y="208" class="step">参考生图 → 画风参考 · Vibe</text>
  <path d="M48 257 H912" stroke="#dde4e8"/>
  <text x="48" y="299" class="route" style="fill:#23699a">A  普通图片：PNG / JPG / WebP</text>
  <circle cx="76" cy="345" r="19" fill="#23699a"/>
  <text x="76" y="353" class="number">1</text>
  <text x="112" y="354" class="step">点击「添加画风参考」，选择图片</text>
  <circle cx="76" cy="407" r="19" fill="#23699a"/>
  <text x="76" y="415" class="number">2</text>
  <text x="112" y="416" class="step">V4 / V4.5：点击「编码参考图」按钮</text>
  <g transform="translate(114 438)" stroke="#23699a" stroke-width="3" fill="none">
    <path d="M0 12 V0 H12 M26 0 H38 V12 M38 26 V38 H26 M12 38 H0 V26"/>
    <path d="M8 19 H30"/>
  </g>
  <text x="171" y="455" class="detail">按钮有文字，手机端可直接点击</text>
  <text x="171" y="488" class="detail">编码可能消耗额度；这一步还不会生成图片</text>
  <path d="M48 521 H912" stroke="#dde4e8"/>
  <text x="48" y="565" class="route" style="fill:#28745a">B  现成编码文件：.naiv4vibe</text>
  <circle cx="76" cy="611" r="19" fill="#28745a"/>
  <text x="76" y="619" class="number">1</text>
  <text x="112" y="620" class="step">把文件下载到设备，保留原后缀</text>
  <circle cx="76" cy="674" r="19" fill="#28745a"/>
  <text x="76" y="682" class="number">2</text>
  <text x="112" y="683" class="step">点击「导入 .naiv4vibe」，选择文件</text>
  <text x="112" y="725" class="detail">手机从文件目录选择，不是在照片相册里找</text>
  <text x="112" y="759" class="detail">匹配当前模型与提取量时，无需重复编码</text>
  <path d="M480 784 V820" stroke="#7d8a92" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="48" y="835" width="864" height="132" rx="8" fill="#edf7f2" stroke="#c3dfd1"/>
  <text x="480" y="878" class="ready">确认已启用，状态为「当前模型可用」</text>
  <text x="480" y="922" class="step center">填写画面提示词 → 点击「生成图像」</text>
  <text x="480" y="1006" class="subtitle center">灵画师 0.26.10 · 操作流程示意，非界面截图</text>
</svg>
