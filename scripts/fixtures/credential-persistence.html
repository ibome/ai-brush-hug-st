<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>秘钥持久化隔离回归</title>
<div id="plugin-root"></div>
<div id="overlay-root"></div>
<div id="toast-root" role="status"></div>
<script type="module">
  import '../../src/styles/plugin.css';
  import { createCredentialVault } from '../../src/credential-vault.js';
  import { createCredentialStore } from '../../src/credential-store.js';
  import { credentialError, credentialFailure } from '../../src/credential-errors.js';
  const parameters = new URLSearchParams(location.search);
  const account = parameters.get('account') || 'credential-fixture';
  const mode = parameters.get('storage') || 'quota';
  const configName = `credential-fixture-config:${account}`;
  const saved = JSON.parse(localStorage.getItem(configName) || 'null');
  const browserStorage = {
    getItem: (name) => {
      if (mode === 'blocked') throw new DOMException('Fixture private detail', 'SecurityError');
      if (mode === 'corrupt') return '{invalid';
      return localStorage.getItem(name);
    },
    setItem: (name, value) => {
      if (mode === 'quota' || mode === 'unavailable') throw new DOMException('Fixture private detail', 'QuotaExceededError');
      if (mode === 'discarded') return;
      localStorage.setItem(name, value);
    },
  };
  const database = mode === 'unavailable' ? {
    async read() { throw credentialError('CREDENTIAL_UNAVAILABLE'); },
    async write() { throw credentialError('CREDENTIAL_UNAVAILABLE'); },
  } : createCredentialStore(account);
  let vault;
  const requests = [];
  const makeVault = () => createCredentialVault({ account, storage: browserStorage, database,
    request: async (action) => {
      requests.push(action);
      if (action === 'settings') return { allowKeysExposure: parameters.has('server-failure') };
      throw new Error('Fixture secret endpoint unavailable');
    },
  });
  vault = makeVault();
  window.__LINGHUASHI_ENV__ = {
    mode: 'extension', account, chat: { name: '隔离测试', count: 0 },
    releaseState: { status: 'current', release: null },
    ui: saved || { settingsVersion: 1, page: parameters.get('page') || 'connection', provider: 'openai', enabled: true,
      characterTheme: 'deepseek', experience: { level: 'full', dismissed: true, goal: 'manual' },
      assistant: { source: 'api', endpoint: 'https://fixture.invalid', model: 'fixture-text-model' },
      openaiEndpoint: 'https://fixture.invalid', openai: { model: 'fixture-image-model', positive: 'quiet garden' },
      connections: { openai: { endpoint: 'https://fixture.invalid', keyRef: '' } } },
  };
  const failures = [], originalFetch = window.fetch.bind(window);
  window.fetch = (url, options = {}) => {
    const address = String(url);
    if (/^https?:/.test(address) && new URL(address).origin !== location.origin) {
      failures.push('external request blocked');
      return Promise.reject(new Error('External network is disabled in this fixture'));
    }
    return originalFetch(url, options);
  };
  window.addEventListener('message', async (event) => {
    if (event.source !== window || event.origin !== location.origin) return;
    const data = event.data;
    let type, value;
    if (data?.type === 'linghuashi:secret-request') {
      type = 'linghuashi:secret-result';
      try { value = data.action === 'read' ? await vault.read(data.provider, data.ref)
        : await vault.write(data.provider, data.key, data.ref); }
      catch (error) {
        const failure = credentialFailure(error, data.action);
        window.postMessage({ type, requestId: data.requestId, error: failure.message, failure }, location.origin);
        return;
      }
    } else if (data?.type === 'linghuashi:storage-request') {
      type = 'linghuashi:storage-result'; value = data.action === 'task/list' ? { rows: [] } : {};
    } else if (data?.type === 'linghuashi:assistant-request') {
      type = 'linghuashi:assistant-result'; value = { characters: [], models: [] };
    } else if (data?.type === 'linghuashi:state') {
      localStorage.setItem(configName, JSON.stringify(data.ui)); type = 'linghuashi:state-result';
    } else return;
    window.postMessage({ type, requestId: data.requestId, value }, location.origin);
  });
  const { normalizeConfig } = await import('../../src/config.js');
  const { mountPlugin, restoreCredentials } = await import('../../src/ui/plugin.js');
  await restoreCredentials();
  mountPlugin(document.querySelector('#plugin-root'), normalizeConfig({ surface: 'console', state: 'ready', theme: 'light' }));
  window.__credentialFixture = { makeVault, database, requests, failures,
    async recreate() { vault = makeVault(); await restoreCredentials(); },
  };
  document.documentElement.dataset.fixtureReady = 'true';
</script>
